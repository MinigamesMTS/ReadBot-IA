<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReadBot AI - Asistente Inteligente</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(-45deg, #0f0f23, #1a1a3e, #2a1a5e, #16213e);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Partículas flotantes */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 90px 40px, #fff, transparent),
                radial-gradient(1px 1px at 130px 80px, rgba(255,255,255,0.6), transparent),
                radial-gradient(2px 2px at 160px 30px, #ddd, transparent);
            background-repeat: repeat;
            background-size: 200px 100px;
            animation: float 20s linear infinite;
            opacity: 0.1;
            pointer-events: none;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-20px) rotate(360deg); }
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(15, 15, 35, 0.95);
            backdrop-filter: blur(25px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
            padding: 20px 40px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
            color: #fff;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 8px 32px rgba(102, 126, 234, 0.4);
            position: relative;
            overflow: hidden;
        }

        .logo-icon::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: rotate(45deg);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        .chat-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 1400px;
            margin: 0 auto;
            padding: 120px 40px 80px;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding-right: 20px;
            scroll-behavior: smooth;
        }

        .messages::-webkit-scrollbar {
            width: 8px;
        }

        .messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, rgba(255,255,255,0.2), rgba(255,255,255,0.1));
            border-radius: 4px;
        }

        .message {
            display: flex;
            margin-bottom: 28px;
            opacity: 0;
            animation: slideIn 0.4s ease forwards;
        }

        @keyframes slideIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user { justify-content: flex-end; }
        .message.user .message-wrapper { animation-delay: 0.1s; }
        .message.bot { animation-delay: 0.2s; }

        .message-wrapper {
            display: flex;
            max-width: 75%;
            transform: translateY(20px);
        }

        .message.bot .message-wrapper {
            flex-direction: row;
        }

        .message.user .message-wrapper {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 600;
            flex-shrink: 0;
            margin: 0 12px;
        }

        .bot-avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
        }

        .user-avatar {
            background: linear-gradient(135deg, #ff6b6b 0%, #feca57 100%);
            color: white;
            box-shadow: 0 4px 20px rgba(255, 107, 107, 0.4);
        }

        .message-content {
            padding: 20px 24px;
            border-radius: 24px;
            position: relative;
            backdrop-filter: blur(20px);
            line-height: 1.6;
            font-size: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .message.bot .message-content {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #e8e8ff;
            border-top-left-radius: 8px;
        }

        .message.user .message-content {
            background: rgba(255, 255, 255, 0.95);
            color: #1a1a2e;
            border-bottom-right-radius: 8px;
            font-weight: 500;
        }

        .input-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 900px;
            background: rgba(15, 15, 35, 0.95);
            backdrop-filter: blur(30px);
            border-radius: 32px;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .input-wrapper {
            display: flex;
            gap: 16px;
            align-items: flex-end;
        }

        #messageInput {
            flex: 1;
            padding: 18px 28px;
            border: none;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            color: #fff;
            font-size: 16px;
            font-family: inherit;
            outline: none;
            resize: none;
            min-height: 24px;
            max-height: 140px;
            line-height: 1.5;
            transition: all 0.3s ease;
        }

        #messageInput:focus {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.3);
        }

        #messageInput::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .send-btn {
            width: 56px;
            height: 56px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .send-btn:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 12px 35px rgba(102, 126, 234, 0.6);
        }

        .send-btn:active {
            transform: translateY(0) scale(0.98);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .typing {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .typing-dots {
            display: flex;
            gap: 6px;
            padding: 20px 24px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(20px);
        }

        .typing-dots span {
            width: 10px;
            height: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            animation: typingBounce 1.4s infinite ease-in-out;
        }

        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
        .typing-dots span:nth-child(3) { animation-delay: 0s; }

        @keyframes typingBounce {
            0%, 80%, 100% { 
                transform: scale(0); 
                opacity: 0.5; 
            }
            40% { 
                transform: scale(1); 
                opacity: 1; 
            }
        }

        .welcome {
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: 20px;
            font-weight: 400;
            margin: 100px 0;
            line-height: 1.6;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .welcome strong {
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }

        @media (max-width: 768px) {
            .header { padding: 16px 24px; }
            .chat-container { padding: 100px 24px 80px; }
            .input-container { width: 95%; bottom: 16px; padding: 10px; }
            .message-wrapper { max-width: 90%; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            <div class="logo-icon">🤖</div>
            <span>ReadBot AI</span>
        </div>
    </div>

    <div class="chat-container">
        <div class="messages" id="messages">
            <div class="welcome">
                <div>¡Bienvenido a <strong>ReadBot AI</strong>!</div>
                <div style="margin-top: 12px; font-size: 16px;">Pregúntame lo que sea. Te responderé con precisión y detalle ✨</div>
            </div>
        </div>
    </div>

    <div class="input-container">
        <div class="input-wrapper">
            <textarea 
                id="messageInput" 
                placeholder="Escribe cualquier pregunta o consulta..."
                rows="1"
            ></textarea>
            <button class="send-btn" id="sendBtn">➤</button>
        </div>
    </div>

    <script>
        class AdvancedReadBot {
            constructor() {
                this.messagesContainer = document.getElementById('messages');
                this.messageInput = document.getElementById('messageInput');
                this.sendBtn = document.getElementById('sendBtn');
                this.conversationHistory = [];
                this.isTyping = false;
                this.typingElement = null;
                
                this.init();
            }

            init() {
                // ✅ BOTÓN ENVIAR FUNCIONA
                this.sendBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    this.sendMessage();
                });

                // ✅ ENTER FUNCIONA (sin Shift)
                this.messageInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.sendMessage();
                    }
                });

                // Auto-resize textarea
                this.messageInput.addEventListener('input', () => {
                    this.autoResize();
                    this.updateSendButton();
                });

                this.autoResize();
                this.updateSendButton();
            }

            autoResize() {
                this.messageInput.style.height = 'auto';
                this.messageInput.style.height = Math.min(this.messageInput.scrollHeight, 140) + 'px';
            }

            updateSendButton() {
                const hasText = this.messageInput.value.trim().length > 0;
                this.sendBtn.disabled = !hasText;
            }

            sendMessage() {
                const message = this.messageInput.value.trim();
                if (!message || this.isTyping) return;

                // AÑADIR MENSAJE DEL USUARIO
                this.addMessage(message, 'user');
                this.messageInput.value = '';
                this.autoResize();
                
                this.conversationHistory.push({ role: 'user', content: message });
                this.isTyping = true;
                this.updateSendButton();

                // MOSTRAR TYPING
                this.showTyping();

                // SIMULAR RESPUESTA
                setTimeout(() => {
                    this.hideTyping();
                    const response = this.generateUniqueResponse(message);
                    this.addMessage(response, 'bot');
                    this.conversationHistory.push({ role: 'assistant', content: response });
                    this.isTyping = false;
                    this.updateSendButton();
                    this.scrollToBottom();
                }, 800 + Math.random() * 1200);
            }

            addMessage(content, sender) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${sender}`;
                
                messageDiv.innerHTML = `
                    <div class="message-wrapper">
                        <div class="avatar ${sender === 'user' ? 'user-avatar' : 'bot-avatar'}">
                            ${sender === 'user' ? '👤' : '🤖'}
                        </div>
                        <div class="message-content">${this.formatMessage(content)}</div>
                    </div>
                `;
                
                this.messagesContainer.appendChild(messageDiv);
                this.scrollToBottom();
                
                // Remover welcome si existe
                const welcome = this.messagesContainer.querySelector('.welcome');
                if (welcome) {
                    welcome.remove();
                }
            }

            formatMessage(text) {
                return text
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*(.*?)\*/g, '<em>$1</em>')
                    .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
                    .replace(/`([^`]+)`/g, '<code>$1</code>');
            }

            showTyping() {
                this.typingElement = document.createElement('div');
                this.typingElement.className = 'message bot typing';
                this.typingElement.innerHTML = `
                    <div class="message-wrapper">
                        <div class="avatar bot-avatar">🤖</div>
                        <div class="typing-dots">
                            <span></span><span></span><span></span>
                        </div>
                    </div>
                `;
                this.messagesContainer.appendChild(this.typingElement);
                this.scrollToBottom();
            }

            hideTyping() {
                if (this.typingElement) {
                    this.typingElement.remove();
                    this.typingElement = null;
                }
            }

            scrollToBottom() {
                this.messagesContainer.scrollTop = this.messagesContainer.scrollHeight;
            }

            generateUniqueResponse(message) {
                const msg = message.toLowerCase().trim();
                const words = message.toLowerCase().split(/\s+/).filter(w => w.length > 2);
                const recentResponses = this.conversationHistory
                    .filter(c => c.role === 'assistant')
                    .slice(-5)
                    .map(c => c.content.toLowerCase());

                // ✅ ANTI-REPETICIÓN: Generar respuesta única
                let attempts = 0;
                let response;
                
                do {
                    response = this.create
