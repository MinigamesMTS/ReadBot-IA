<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackbox AI Clone</title>
    <style>
        /* Variables de color */
        :root {
            --bg-color: #0f1115;
            --sidebar-bg: #0b0c0f;
            --text-main: #ffffff;
            --text-muted: #8b8d93;
            --border-color: #2a2d35;
            --accent-hover: #1e2026;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Barra Lateral (Sidebar) */
        .sidebar {
            width: 60px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
            gap: 25px;
            color: var(--text-muted);
        }

        .sidebar div {
            cursor: pointer;
            font-size: 18px;
        }

        .sidebar div:hover {
            color: var(--text-main);
        }

        /* Contenido Principal */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Navegación Superior */
        .top-nav {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 20px 40px;
            gap: 25px;
            font-size: 14px;
            font-weight: 500;
        }

        .top-nav a {
            color: var(--text-main);
            text-decoration: none;
            transition: color 0.2s;
        }

        .top-nav a:hover {
            color: var(--text-muted);
        }

        .btn-get-started {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
        }

        .btn-get-started:hover {
            background-color: var(--accent-hover);
        }

        /* Área Central (Chat/Búsqueda) */
        .center-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-bottom: 100px;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Contenedor de mensajes (Oculto inicialmente) */
        #chat-history {
            width: 100%;
            max-height: 50vh;
            overflow-y: auto;
            margin-bottom: 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 0 20px;
        }

        .message {
            padding: 15px;
            border-radius: 10px;
            max-width: 80%;
            line-height: 1.5;
        }

        .user-message {
            background-color: var(--accent-hover);
            align-self: flex-end;
            border: 1px solid var(--border-color);
        }

        .ai-message {
            background-color: transparent;
            align-self: flex-start;
            color: #d1d5db;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
            font-weight: bold;
            color: var(--text-muted);
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        /* Input Box */
        .input-container {
            width: 100%;
            background-color: var(--sidebar-bg);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            display: flex;
            align-items: center;
            padding: 10px 20px;
            gap: 15px;
        }

        .input-container input {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 16px;
            outline: none;
        }

        .input-container input::placeholder {
            color: var(--text-muted);
        }

        .model-selector {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 14px;
            cursor: pointer;
            outline: none;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 18px;
        }

        /* Botones de acción rápida */
        .quick-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .action-chip {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-chip:hover {
            background-color: var(--accent-hover);
            color: var(--text-main);
        }

        /* Banner Inferior */
        .bottom-banner-container {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .bottom-banner {
            background-color: transparent;
            border: 1px solid var(--border-color);
            padding: 12px 20px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .badge-new {
            background-color: var(--accent-hover);
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: bold;
        }

        .btn-explore {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 16px;
            border-radius: 15px;
            cursor: pointer;
        }

        .footer-text {
            color: var(--text-muted);
            font-size: 11px;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div>⬡</div>
        <div>+</div>
        <div>↺</div>
        <div>☁</div>
        <div>﹀</div>
        <div>⚙</div>
    </div>

    <div class="main-content">
        
        <nav class="top-nav">
            <a href="#">About</a>
            <a href="#">Pricing</a>
            <a href="#">Features</a>
            <a href="#">API</a>
            <a href="#">Releases</a>
            <a href="#">VSCode</a>
            <a href="#">Sign In</a>
            <button class="btn-get-started">Get Started for Free</button>
        </nav>

        <div class="center-area">
            
            <div id="chat-history">
                </div>

            <div class="logo-container" id="main-logo">
                <span>⬡</span>
                <span>BLACKBOX AI</span>
            </div>

            <div class="input-container">
                <button class="icon-btn">📎</button>
                <input type="text" id="user-input" placeholder="Message Blackbox" autocomplete="off">
                <select class="model-selector">
                    <option>Select Models ﹀</option>
                </select>
                <button class="icon-btn">🎤</button>
            </div>

            <div class="quick-actions" id="quick-actions">
                <button class="action-chip">☁ Agent</button>
                <button class="action-chip">❯_ CLI</button>
                <button class="action-chip">⚡ VSCode</button>
                <button class="action-chip">🖥 Desktop</button>
                <button class="action-chip">&lt;/&gt; API</button>
                <button class="action-chip">&lt;/&gt; IDE</button>
            </div>
        </div>

        <div class="bottom-banner-container">
            <div class="bottom-banner">
                <span class="badge-new">New</span>
                <span>Crossed +30M users. Get started with BLACKBOX Agent on VSCode</span>
                <button class="btn-explore">Explore</button>
            </div>
            <div class="footer-text">
                By using Blackbox you agree to the Terms and Privacy.
            </div>
        </div>

    </div>

    <script>
        const inputField = document.getElementById('user-input');
        const chatHistory = document.getElementById('chat-history');
        const mainLogo = document.getElementById('main-logo');
        const quickActions = document.getElementById('quick-actions');

        // Función para agregar mensajes a la pantalla
        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message');
            messageDiv.classList.add(sender === 'user' ? 'user-message' : 'ai-message');
            messageDiv.textContent = text;
            chatHistory.appendChild(messageDiv);
            
            // Auto-scroll hacia abajo
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        // Escuchar cuando el usuario presiona "Enter"
        inputField.addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && inputField.value.trim() !== '') {
                const userText = inputField.value.trim();
                
                // Ocultar logo y acciones rápidas al iniciar el chat (como en las apps reales)
                mainLogo.style.display = 'none';
                quickActions.style.display = 'none';

                // Mostrar el mensaje del usuario
                addMessage(userText, 'user');
                inputField.value = ''; // Limpiar el input

                // Simular un tiempo de carga y luego responder
                setTimeout(() => {
                    const fakeAiResponse = `He recibido tu mensaje: "${userText}". Como soy una demostración de interfaz estática (HTML/CSS/JS), esta es una respuesta simulada. Para conectarme a una IA real, necesitarías implementar un fetch() hacia una API de backend.`;
                    addMessage(fakeAiResponse, 'ai');
                }, 1000); // Espera 1 segundo para responder
            }
        });
    </script>
</body>
</html>
