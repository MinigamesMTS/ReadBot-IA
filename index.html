<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agar.io Clon</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <div class="menu-container">
        <h1 class="logo">Agar.io</h1>
        
        <p class="subtitle">La masa lo es todo.</p>
        
        <input type="text" id="nick" class="input-nick" placeholder="Apodo" maxlength="15" autofocus>
        
        <button class="btn-play">Jugar</button>
        
        <div class="secondary-buttons">
            <button class="btn-spectate">Espectador</button>
            <button class="btn-settings">⚙️ Ajustes</button>
        </div>

        <div class="instructions">
            <p>Mueve tu ratón para controlar tu célula.</p>
            <p>Presiona <b>Espacio</b> para dividirte.</p>
            <p>Presiona <b>W</b> para expulsar masa.</p>
        </div>
    </div>

</body>
</html>
